<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Социология Управления: Тест для 1 курса</title>
    
    <style>
        :root {
            /* Новая Фиолетовая Палитра */
            --primary-purple: #7f00ff; /* Яркий акцент для кнопок и выделений */
            --dark-purple-bg: #1e003a; /* Глубокий баклажановый фон */
            --start-card-bg: #281140; /* Темно-фиолетовая карточка старта */
            --text-light: #e0e0e0; 
            --text-muted: #c2b3d8; /* Приглушенный текст для слогана */
            --text-dark: #2c3e50;
            --card-background: #ffffff; /* Фон карточек вопросов */
            --active-selection: #ff9800; /* Оранжевый для выделения ответа */
        }

        body {
            font-family: 'Arial', sans-serif; 
            color: var(--text-dark);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background 1s ease-in-out, background-color 0.5s; 
            
            /* УНИФИЦИРОВАННЫЙ ФОН: ГЛУБОКИЙ ФИОЛЕТОВЫЙ ГРАДИЕНТ ДЛЯ ВСЕГО */
            background: linear-gradient(135deg, var(--dark-purple-bg) 0%, #0d0d0d 100%);
            background-attachment: fixed;
            color: var(--text-light); 
            position: relative; 
        }
        
        /* ВИЗУАЛЬНЫЙ "ШУМ" НА ФОНЕ */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 5px 5px;
            opacity: 0.5; 
            pointer-events: none;
        }

        /* MAIN КОНТЕЙНЕР ДЛЯ ЦЕНТРИРОВАНИЯ */
        main {
            display: flex;
            justify-content: center; 
            align-items: center; 
            flex-grow: 1; 
            width: 100%;
            z-index: 1; 
        }

        #quiz-header {
            display: none; 
        }

        /* Стиль для стартового экрана и контейнера теста */
        #start-screen, #quiz-container {
            width: 90%;
            max-width: 1000px; 
            padding: 50px 60px; 
            margin: 30px auto;
            border-radius: 20px; 
        }

        /* СТАРТОВЫЙ ЭКРАН */
        #start-screen {
            text-align: center;
            background: var(--start-card-bg); 
            border: 1px solid #4a3363; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(127, 0, 255, 0.2); 
        }
        
        #start-title {
            color: var(--text-light);
            font-size: 2.5em; 
            font-weight: 800;
            margin-bottom: 10px; 
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3); 
        }

        #start-slogan {
            color: var(--text-muted); 
            font-size: 1.1em;
            margin-bottom: 50px; 
            font-weight: 400;
            text-align: center;
        }

        /* КОНТЕЙНЕР ТЕСТА */
        #quiz-container {
            background: var(--card-background); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); 
        }
        
        /* СТИЛИ КАРТОЧЕК ВОПРОСОВ И ОТВЕТОВ (на белом фоне) */
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px; 
            border-bottom: 3px solid #f0f0f0; 
            padding-bottom: 15px; 
        }

        .question-header h2 {
            font-size: 1.6em; 
            color: var(--primary-purple); 
            font-weight: 800;
            margin: 0;
            padding: 0;
        }

        #question-number {
            font-size: 1.6em; 
            color: var(--primary-purple); 
            font-weight: 700;
        }

        #question-text {
            font-size: 1.9em; 
            margin-bottom: 40px;
            font-weight: 700;
            line-height: 1.4;
            color: #34495e;
        }

        .answers {
            display: flex;
            flex-wrap: wrap; 
            justify-content: space-between;
            gap: 20px; 
        }

        .answers button {
            width: calc(50% - 10px); 
            padding: 25px; 
            border: 2px solid #ddd; 
            border-radius: 30px; 
            background-color: var(--card-background);
            text-align: center; 
            font-size: 1.3em; 
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            font-weight: 500;
            color: var(--text-dark);
        }
        
        @media (max-width: 768px) {
            .answers button {
                width: 100%;
            }
            #quiz-container, #start-screen {
                 padding: 30px;
            }
            #start-title {
                font-size: 1.8em;
            }
        }

        .answers button:hover:not(:disabled) {
            background-color: #f5f0ff; 
            border-color: var(--primary-purple);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(127, 0, 255, 0.2);
        }
        
        .answers button.selected {
            border-color: var(--active-selection); 
            background-color: #fffaf0; 
            box-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
        }

        /* СТИЛИ ДЛЯ ЭКРАНА РЕЗУЛЬТАТОВ (НА ТЕМНОМ ФОНЕ) */
        .result-box {
            width: 90%;
            max-width: 1000px; 
            padding: 60px;
            border-radius: 20px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: rgba(40, 17, 64, 0.5); /* Полупрозрачная карточка, чтобы видеть фон */
            border: 1px solid #4a3363;
            box-shadow: 0 0 20px rgba(127, 0, 255, 0.2);
            /* СТИЛИЗАЦИЯ ТЕКСТА НА ТЕМНОМ ФОНЕ */
            color: var(--text-light); 
        }

        .result-box h2 {
            color: var(--primary-purple);
            font-size: 2.5em;
            margin-bottom: 30px;
        }

        #final-score {
            font-size: 1.8em;
            color: var(--text-light); 
            margin-bottom: 40px;
            line-height: 1.4;
        }
        
        /* БОЛЬШОЙ ЦЕНТРАЛЬНЫЙ СЧЕТ */
        .score-display {
            font-size: 3.5em; /* Очень крупный шрифт */
            font-weight: 800;
            color: var(--active-selection); /* Оранжевый акцент */
            margin: 20px 0;
            text-shadow: 0 0 10px rgba(255, 152, 0, 0.5);
        }

        /* Кнопки действий */
        #next-button, #start-button, .result-box button {
            display: block;
            width: 100%;
            max-width: 400px; 
            padding: 20px;
            margin-top: 40px;
            border: none;
            border-radius: 30px; 
            font-size: 1.8em; 
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 700;
            color: white;
            letter-spacing: 1px;
        }
        
        /* СТИЛЬ КНОПОК - ФИОЛЕТОВЫЙ АКЦЕНТ */
        #start-button, #next-button, .result-box button {
            background-color: var(--primary-purple); 
            box-shadow: 0 5px 15px rgba(127, 0, 255, 0.4);
        }

        #start-button:hover, #next-button:hover:not(:disabled), .result-box button:hover {
            background-color: #6600cc;
            box-shadow: 0 8px 20px rgba(127, 0, 255, 0.6);
            transform: translateY(-2px);
        }

        #next-button:disabled {
            background-color: #a081c2; 
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
    </style>
</head>
<body>
    <header id="quiz-header"></header>
    
    <main>
        <div id="start-screen"> 
            <h1 id="start-title">Тест по социологии управления</h1>
            
            <p id="start-slogan">Проверьте свои знания в области организации, лидерства и социальных процессов.</p>
            
            <button id="start-button">НАЧАТЬ ТЕСТ</button>
        </div>
        
        <div id="quiz-container" style="display: none;">
            <div class="question-header">
                <h2>ВОПРОС</h2>
                <div id="question-number"></div>
            </div>

            <div id="question-text"></div>
            <div class="answers">
                </div>
            
            <button id="next-button" disabled>Следующий вопрос</button>
        </div>
        
        <div class="result-box" id="result-box" style="display: none;">
            <h2>Тест завершен!</h2>
            <div id="final-score"></div>
            
            <button onclick="window.location.reload()">Начать тест сначала</button>
        </div>
        </main>

    <script>
        // 1. Данные теста 
        const quizData = [
            {
                question: "Социальное явление, описывающее тенденцию группы принимать решения, которые избегают конфликтов",
                answers: [
                    { text: "Сотрудничество", correct: false },
                    { text: "Групповое мышление", correct: true },
                    { text: "Мозговой штурм", correct: false },
                    { text: "Делегирование", correct: false }
                ]
            },
            {
                question: "Что из перечисленного является ключевым компонентом теории бюрократии Макса Вебера?",
                answers: [
                    { text: "Неформальные коммуникации", correct: false },
                    { text: "Иерархическая структура", correct: true },
                    { text: "Гибкость и адаптивность", correct: false },
                    { text: "Эмоциональный интеллект лидера", correct: false }
                ]
            },
            {
                question: "Какой стиль руководства характеризуется полным предоставлением свободы действий подчиненным?",
                answers: [
                    { text: "Авторитарный", correct: false },
                    { text: "Демократический", correct: false },
                    { text: "Либеральный (невмешивающийся)", correct: true },
                    { text: "Трансформационный", correct: false }
                ]
            },
        ];

        // 2. Переменные для состояния теста
        const QUESTIONS_TO_ASK = quizData.length; 
        let currentShuffledQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = []; 
        let currentSelectedAnswerIndex = null; 

        // 3. Получение элементов DOM
        const body = document.body; 
        const quizContainer = document.getElementById('quiz-container');
        const startScreen = document.getElementById('start-screen');
        const startButton = document.getElementById('start-button');
        const questionNumberDiv = document.getElementById('question-number');
        const questionTextDiv = document.getElementById('question-text');
        const answersDiv = document.querySelector('.answers');
        const nextButton = document.getElementById('next-button');
        // !!! ИСПРАВЛЕНИЕ: Получаем result-box по новому ID/классу !!!
        const resultBox = document.getElementById('result-box');
        const finalScore = document.getElementById('final-score');

        // 4. Вспомогательная функция для перемешивания
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // 5. Функция выбора и перемешивания вопросов
        function shuffleAndSelectQuestions() {
            let shuffledQuizData = [...quizData];
            shuffleArray(shuffledQuizData);
            currentShuffledQuestions = shuffledQuizData.slice(0, QUESTIONS_TO_ASK);
            currentShuffledQuestions.forEach(q => shuffleArray(q.answers));
            userAnswers = Array(QUESTIONS_TO_ASK).fill(null); 
        }

        // 6. Функция отображения вопроса
        function showQuestion() {
            if (currentQuestionIndex >= QUESTIONS_TO_ASK) {
                showResults();
                return;
            }

            const currentQuestion = currentShuffledQuestions[currentQuestionIndex];
            
            currentSelectedAnswerIndex = userAnswers[currentQuestionIndex]; 
            
            answersDiv.innerHTML = '';
            
            nextButton.disabled = (currentSelectedAnswerIndex === null); 

            questionNumberDiv.textContent = `${currentQuestionIndex + 1}/${QUESTIONS_TO_ASK}`;
            questionTextDiv.textContent = currentQuestion.question;

            // Обновление текста кнопки
            if (currentQuestionIndex === QUESTIONS_TO_ASK - 1) {
                nextButton.textContent = 'ЗАВЕРШИТЬ ТЕСТ';
            } else {
                nextButton.textContent = 'Следующий вопрос';
            }


            currentQuestion.answers.forEach((answer, index) => {
                const button = document.createElement('button');
                button.textContent = answer.text;
                button.setAttribute('data-index', index); 
                button.addEventListener('click', () => selectAnswer(button));
                answersDiv.appendChild(button);

                if (currentSelectedAnswerIndex === index) {
                    button.classList.add('selected');
                }
            });
        }

        // 7. ЛОГИКА: Выбор ответа 
        function selectAnswer(selectedButton) {
            Array.from(answersDiv.children).forEach(button => {
                button.classList.remove('selected');
            });
            
            selectedButton.classList.add('selected');
            
            currentSelectedAnswerIndex = parseInt(selectedButton.getAttribute('data-index'));
            
            nextButton.disabled = false;
        }

        // 8. ФУНКЦИЯ ПЕРЕХОДА К СЛЕДУЮЩЕМУ ВОПРОСУ 
        function processNextClick() {
            // 1. Сохраняем выбор
            if (currentSelectedAnswerIndex !== null) {
                userAnswers[currentQuestionIndex] = currentSelectedAnswerIndex;
            }
            
            // 2. Проверяем, был ли это последний вопрос
            if (currentQuestionIndex === QUESTIONS_TO_ASK - 1) {
                showResults(); // Если последний, показываем результаты
            } else {
                // Если не последний, переходим к следующему
                currentQuestionIndex++;
                currentSelectedAnswerIndex = null; // Сбрасываем временный выбор
                showQuestion();
            }
        }
        
        nextButton.addEventListener('click', processNextClick);


        // 9. ФУНКЦИЯ ОТОБРАЖЕНИЯ РЕЗУЛЬТАТОВ (ГЛАВНОЕ ИСПРАВЛЕНИЕ: ПРЯМОЙ ВЫЗОВ resultBox)
        function showResults() {
            // Скрываем контейнер вопросов
            quizContainer.style.display = 'none';
            // Показываем контейнер результатов (который теперь внешний и независимый)
            resultBox.style.display = 'flex'; 
            
            let finalScoreCount = 0;
            currentShuffledQuestions.forEach((question, index) => {
                const selectedAnswerIndex = userAnswers[index];
                
                if (selectedAnswerIndex !== null) {
                    const isCorrect = question.answers[selectedAnswerIndex].correct;
                    if (isCorrect) {
                        finalScoreCount++;
                    }
                }
            });
            score = finalScoreCount; 

            const percentage = (score / QUESTIONS_TO_ASK) * 100;
            let message = '';

            if (percentage === 100) {
                message = 'Поздравляем! Вы набрали максимум баллов!';
            } else if (percentage >= 70) {
                message = 'Отличный результат! У вас очень хорошие знания.';
            } else if (percentage >= 40) {
                message = 'Неплохо, но есть над чем поработать.';
            } else {
                message = 'Требуется повторение материала. Не сдавайтесь!';
            }

            finalScore.innerHTML = `
                <div class="score-display">${score} из ${QUESTIONS_TO_ASK}</div>
                <p style="font-size: 1.2em; margin-bottom: 20px;">Правильных ответов: 
                <strong style="color: var(--active-selection);">${score}</strong> (${percentage.toFixed(0)}%)
                </p>
                <p style="font-size: 1.4em; font-weight: 500; font-style: italic;">${message}</p>
            `;
        }
        
        // 10. ФУНКЦИЯ ДЛЯ ЗАПУСКА ТЕСТА 
        function startQuiz() {
            body.style.background = `linear-gradient(135deg, ${getComputedStyle(document.documentElement).getPropertyValue('--dark-purple-bg')} 0%, #0d0d0d 100%)`;
            body.style.color = 'var(--text-dark)'; 
            
            document.getElementById('quiz-header').style.display = 'none'; 
            startScreen.style.display = 'none';
            
            quizContainer.style.display = 'block';
            
            currentQuestionIndex = 0;
            score = 0;
            resultBox.style.display = 'none';
            
            shuffleAndSelectQuestions();
            showQuestion();
        }

        // 11. СЛУШАТЕЛЬ СОБЫТИЯ ДЛЯ КНОПКИ НАЧАТЬ
        startButton.addEventListener('click', startQuiz);

    </script>
</body>
</html>
